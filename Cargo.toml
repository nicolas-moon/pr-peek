[package]
name = "pr-peek"
version = "0.2.1"
edition = "2024"
description = "List a GitHub user's open PRs in a repository, with review and merge queue status"
repository = "https://github.com/nicolas-moon/pr-peek"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"]}
owo-colors = "4.3.0"
reqwest = { version = "0.13.4", features = ["json", "query"]}
serde = { version = "1.0.229", features = ["derive"] }
tabled = { version = "0.21.0", features = ["ansi"] }
terminal_size = "0.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
