[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Publish GitHub artifact attestations for every release artifact
github-attestations = true
# Sign macOS binaries with a Developer ID certificate.
# Requires CODESIGN_IDENTITY, CODESIGN_CERTIFICATE, and
# CODESIGN_CERTIFICATE_PASSWORD repository secrets.
macos-sign = true

# The legacy macos-14 (Sonoma) runner's `security import` rejects modern
# OpenSSL-generated PKCS#12 files ("MAC verification failed") even with the
# correct password; macos-15 (Sequoia) imports them fine.
github-custom-runners = { "aarch64-apple-darwin" = "macos-15" }
